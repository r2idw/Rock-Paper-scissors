<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper & Scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div class="head"><h1>Demo Js game ro, pa, sci</h1></div>
        <div class="rps-ui">
            <div class="selection-container">
                <div class="btn-control">
                    <button id="rock" value="Rock">Rock</button>
                    <button id="paper" value="Paper">Paper</button> 
                    <button id="scissors" value="Scissors">Scissors</button>
                </div>                
            </div>         
            <div class="dashbord">
                <span id="ur-score"></span>
                <span id="comp-score"></span>
                <span id="result"></span> 
                <span id="total"></span>                 
            </div>             
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
